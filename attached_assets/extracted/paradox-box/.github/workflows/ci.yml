name: Enterprise Production Readiness CI/CD Pipeline

on:
  pull_request:
    branches: [ main, production ]
  push:
    branches: [ main ]

jobs:
  verification-gate:
    name: Institutional Due Diligence & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle Wrapper Immutability & Checksums
        uses: gradle/wrapper-validation-action@v2

      - name: Execute Robolectric Unit Tests & Idempotency Verification
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Execute Roborazzi Visual Regression Verification
        run: gradle :app:verifyRoborazziDebug --no-daemon

      - name: Archive Immutable Audit Trail & Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solvex-due-diligence-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
